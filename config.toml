base_url = "https://blog.long.black/"
title = "Long Nguyen-Vu"
description = "Notes on software, machine learning, life in Korea, and everything in between."
theme = "apollo"
build_search_index = true
generate_feeds = true
compile_sass = true
minify_html = true
taxonomies = [{ name = "tags" }]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
toc = true
use_cdn = false
favicon = "/icon/favicon.png"
theme = "toggle-auto"   # follow the OS light/dark setting until the reader toggles
fancy_code = true
dynamic_note = true
mathjax = false         # enable per page with `[extra] mathjax = true`
repo_url = "https://github.com/nguyenvulong/blog/tree/main/content/"

menu = [
  { name = "/posts", url = "/posts", weight = 1 },
  { name = "/about", url = "/about", weight = 2 },
  { name = "/tags", url = "/tags", weight = 3 },
]

socials = [
  { name = "github", url = "https://github.com/nguyenvulong/", icon = "github" },
]

[extra.taxonomies]
sort_by = "page_count"
reverse = true

[extra.analytics]
enabled = false
